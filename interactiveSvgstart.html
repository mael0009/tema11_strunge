<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Tema 11</title>
    <script type="text/javascript" src="interactiveSvgStart.js"></script>
  </head>
  <style>
    #lokationer {
      width: 30vw;
      min-width: 400px;
      font-size: 1.5rem;
      transform: translateY(-20px);
      animation: draw 0.5s 0s ease-out forwards;
      border-radius: 10px;
      font-size: 20px;
    }

    @keyframes draw {
      to {
        opacity: 1;
        transform: translateY(0px);
      }
    }

    img {
      max-width: 100%;
      object-fit: contain;
    }

    ::backdrop {
      backdrop-filter: blur(3px);
    }

    #poi circle:hover {
      fill: rgb(102, 102, 117);
      cursor: pointer;
    }

    #kort {
      width: 80%;
      margin: auto;
    }

    #kort svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 15px;
    }

    #lokationtekst {
      white-space: pre-line;
    }
  </style>

  <body>
    <section>
      <h1>Michael Strunge</h1>
      <h2>Her er interaktivt kort over stederne, der formede Strunge.</h2>

      <div id="kort"></div>

      <article id="lokationer" popover>
        <p id="lokationtekst"></p>

        <!-- <img src="" alt="" id="kunstnerbillede" /> -->
      </article>
    </section>

    <section>
      <h1>Motion graphic</h1>
      <a href="">Link til Youtube</a>
    </section>
  </body>
</html>
